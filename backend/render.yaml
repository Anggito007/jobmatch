# Render Blueprint — deploy backend ke Render (free tier).
#
# Catatan free tier:
# - Disk 512MB (ephemeral, hilang saat tidur). Image fastembed ~<400MB → muat.
# - Service tidur setelah 15 menit idle → cold start ~1 menit.
# - SQLite (default) bersifat sementara. Untuk data persistent, set
#   DATABASE_URL ke Neon/Supabase Postgres (gratis) sebelum deploy.

services:
  - type: web
    name: jobmatch-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: FETCH_INTERVAL_HOURS
        value: "6"
      # Ganti ke URL Postgres Neon bila ingin data persistent:
      - key: DATABASE_URL
        value: sqlite:////app/jobmatch.db
